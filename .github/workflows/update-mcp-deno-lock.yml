name: Refresh MCP Deno lock

on:
  push:
    branches: [feature/scrolllibrary-mcp-plugin]
    paths:
      - "supabase/functions/mcp/**"
      - ".github/workflows/update-mcp-deno-lock.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/scrolllibrary-mcp-plugin
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - name: Refresh frozen Edge dependency lock
        shell: bash
        run: |
          set -euo pipefail
          cd supabase/functions
          mapfile -d '' entries < <(find . -type f -name '*.ts' -print0 | sort -z)
          test "${#entries[@]}" -gt 0
          deno install --config deno.json --entrypoint --lockfile-only --frozen=false "${entries[@]}"
      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/functions/deno.lock; then
            echo "Deno lock already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/deno.lock
          git commit -m "Update frozen Deno lock for MCP connector"
          git push origin HEAD:feature/scrolllibrary-mcp-plugin
