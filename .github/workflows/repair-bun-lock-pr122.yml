name: Repair Bun lockfile for PR 122

on:
  push:
    branches:
      - fix/production-dependency-security-20261004
    paths:
      - .github/workflows/repair-bun-lock-pr122.yml

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/production-dependency-security-20261004
          fetch-depth: 0

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Regenerate lockfile from package manifest
        run: bun install --lockfile-only

      - name: Verify frozen install
        run: bun install --frozen-lockfile

      - name: Commit regenerated lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "bun.lock already converged"
            exit 0
          fi
          git commit -m "fix: regenerate Bun lockfile after dependency reclassification"
          git push origin HEAD:fix/production-dependency-security-20261004
