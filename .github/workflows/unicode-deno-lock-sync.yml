name: Unicode Deno Lock Sync

on:
  push:
    branches:
      - fix/unicode-safe-pdf-kdp
    paths:
      - supabase/functions/deno.json
      - supabase/functions/deno.lock
      - supabase/functions/_shared/pdf-unicode-fonts.ts
      - .github/workflows/unicode-deno-lock-sync.yml

permissions:
  contents: write

concurrency:
  group: unicode-deno-lock-sync
  cancel-in-progress: false

jobs:
  sync-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/unicode-safe-pdf-kdp
          fetch-depth: 1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - name: Regenerate only Deno lock metadata
        shell: bash
        run: |
          set -euo pipefail
          cd supabase/functions
          deno install --config deno.json --entrypoint --lockfile-only _shared/pdf-unicode-fonts.ts
      - name: Commit generated lock if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/functions/deno.lock; then
            echo "Deno lock already synchronized."
            exit 0
          fi
          git diff --check -- supabase/functions/deno.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/deno.lock
          git commit -m "Sync Unicode PDF Deno lock metadata"
          git push origin HEAD:fix/unicode-safe-pdf-kdp
