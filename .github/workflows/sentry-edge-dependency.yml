name: Sentry Edge Dependency

on:
  push:
    branches:
      - claude/scroll-wisdom-weave-review-mtckux

permissions:
  contents: write

jobs:
  add-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: claude/scroll-wisdom-weave-review-mtckux
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - run: bun install --frozen-lockfile
      - name: Add exact Sentry Deno SDK to dependency graph
        run: bun add --exact @sentry/deno@10.73.0
      - name: Verify shared Edge Sentry boundary
        run: |
          deno check supabase/functions/_shared/error-tracking.ts
          deno check supabase/functions/_shared/http.ts
      - name: Commit verified dependency pin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          if git diff --cached --quiet; then
            echo "No dependency change required"
            exit 0
          fi
          git commit -m "deps: pin Sentry Deno SDK"
          git push origin HEAD:claude/scroll-wisdom-weave-review-mtckux
