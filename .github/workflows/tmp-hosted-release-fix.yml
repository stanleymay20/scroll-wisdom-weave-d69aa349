name: Temporary hosted release identity patch

on:
  push:
    branches:
      - fix/hosted-release-identity-verification-20261004

permissions:
  contents: write

jobs:
  patch-vite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/hosted-release-identity-verification-20261004
          fetch-depth: 0
      - name: Patch hosted production identity selection
        shell: python
        run: |
          from pathlib import Path
          path = Path('vite.config.ts')
          text = path.read_text()
          old_import = 'import { resolveBuildCommit, requireReleaseCommit } from "./scripts/build-commit.mjs";'
          new_import = 'import { resolveBuildCommit, resolveProductionBuildCommit } from "./scripts/build-commit.mjs";'
          old_line = '  const { commit, source: commitSource } = mode === "production" ? requireReleaseCommit() : resolveBuildCommit();'
          new_line = '  const { commit, source: commitSource } = mode === "production" ? resolveProductionBuildCommit() : resolveBuildCommit();'
          if text.count(old_import) != 1 or text.count(old_line) != 1:
              raise SystemExit('Expected vite identity contract did not match exactly once')
          path.write_text(text.replace(old_import, new_import).replace(old_line, new_line))
          Path('.github/workflows/tmp-hosted-release-fix.yml').unlink()
      - name: Commit deterministic patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vite.config.ts .github/workflows/tmp-hosted-release-fix.yml
          git commit -m "Release: make hosted production identity reachable"
          git push origin HEAD:fix/hosted-release-identity-verification-20261004
