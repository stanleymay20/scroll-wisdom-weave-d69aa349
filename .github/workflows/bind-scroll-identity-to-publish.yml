name: Bind Scroll identity to publication

on:
  push:
    branches: [main]
    paths:
      - scripts/bind-scroll-identity-to-publish.mjs
      - .github/workflows/bind-scroll-identity-to-publish.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply fail-fast Scroll identity patch
        run: node scripts/bind-scroll-identity-to-publish.mjs
      - name: Commit publication binding to main
        run: |
          if git diff --quiet; then
            echo "No source change produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/publish-work/index.ts
          git commit -m "feat(identity): bind Scroll IDs to publication transaction"
          git pull --rebase origin main
          git push origin HEAD:main
