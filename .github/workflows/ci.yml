name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.2.23
  DENO_VERSION: 2.9.6
  SUPABASE_CLI_VERSION: 2.111.0

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test

  migration-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Reject destructive migrations in hardened migration era
        run: bun scripts/check-migration-safety.mjs

  database-schema:
    name: Apply and lint Supabase schema
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v2.1.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
          github-token: ${{ github.token }}
      - name: Apply every migration to a fresh local Supabase database
        run: supabase db start
      - name: Fail on PostgreSQL function and schema errors
        run: supabase db lint --local --schema public --level error --fail-on error

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Node type dependencies used by Edge Function declarations
        run: bun install --frozen-lockfile
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Type-check critical financial Edge Functions
        run: |
          deno check supabase/functions/create-checkout/index.ts
          deno check supabase/functions/customer-portal/index.ts
          deno check supabase/functions/check-subscription/index.ts
          deno check supabase/functions/stripe-webhook/index.ts
      - name: Type-check authority and metered usage Edge Functions
        run: |
          deno check supabase/functions/claim-admin/index.ts
          deno check supabase/functions/text-to-speech/index.ts
          deno check supabase/functions/validate-certificate/index.ts
          deno check supabase/functions/verify-certificate/index.ts
          deno check supabase/functions/export-certificate/index.ts
      - name: Type-check ScrollUniversity Edge Functions
        run: |
          deno check supabase/functions/university-provision-users/index.ts
          deno check supabase/functions/university-lti-login/index.ts
          deno check supabase/functions/university-lti-launch/index.ts
          deno check supabase/functions/university-lti-claim/index.ts
      - name: Test ScrollUniversity protocol primitives
        run: |
          deno test supabase/functions/_shared/university-lti_test.ts
      - name: Type-check publication pipeline Edge Functions
        run: |
          deno check supabase/functions/generate-book/index.ts
          deno check supabase/functions/generate-chapter/index.ts
          deno check supabase/functions/generate-cover/index.ts
          deno check supabase/functions/generate-cover-raw/index.ts
          deno check supabase/functions/register-custom-cover/index.ts
          deno check supabase/functions/chief-editor-audit/index.ts
          deno check supabase/functions/deep-research/index.ts
          deno check supabase/functions/generate-references/index.ts
          deno check supabase/functions/verify-references/index.ts
          deno check supabase/functions/qa-publishability-audit/index.ts
          deno check supabase/functions/cross-chapter-consistency-audit/index.ts
          deno check supabase/functions/certify-asset-rights/index.ts
          deno check supabase/functions/certify-production-render/index.ts
          deno check supabase/functions/finalize-publication-certification/index.ts
          deno check supabase/functions/publishing-identity/index.ts
          deno check supabase/functions/publish-work/index.ts
          deno check supabase/functions/enqueue-export-bundle/index.ts
          deno check supabase/functions/export-book/index.ts
          deno check supabase/functions/distribution-metadata/index.ts
          deno check supabase/functions/export-onix/index.ts
          deno check supabase/functions/resolve-scroll-id/index.ts
          deno check supabase/functions/scrollvision-retrieve/index.ts
      - name: Test publication trust engines
        run: |
          deno test supabase/functions/_shared/isbn_test.ts
          deno test supabase/functions/_shared/scroll-identity_test.ts
          deno test supabase/functions/_shared/onix_test.ts
          deno test supabase/functions/_shared/structuralConsistency_test.ts
          deno test supabase/functions/_shared/assetRights_test.ts
          deno test supabase/functions/_shared/productionArtifactAudit_test.ts
          deno test supabase/functions/_shared/kdp-print-cover_test.ts
          deno test supabase/functions/_shared/kdp-cover-resolution_test.ts

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build immutable release artifact and enforce bundle budgets
        run: bun run build:release
      - name: Upload commit-addressed release artifact
        uses: actions/upload-artifact@v6
        with:
          name: web-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CI_SUPABASE_PUBLISHABLE_KEY || 'ci-public-placeholder' }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Install Chromium and operating-system dependencies
        run: bunx playwright install --with-deps chromium
      - name: Run deterministic browser smoke tests
        run: bun run test:e2e
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Reject committed high-confidence secrets
        run: bun run audit:secrets
      - name: Reject high or critical production dependency vulnerabilities
        run: bun run audit:dependencies
