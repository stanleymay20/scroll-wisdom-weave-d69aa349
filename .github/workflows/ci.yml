name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.2.23
  DENO_VERSION: 2.9.6
  SUPABASE_CLI_VERSION: 2.111.0

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test

  migration-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Reject destructive migrations in hardened migration era
        run: bun scripts/check-migration-safety.mjs

  database-schema:
    name: Apply and lint Supabase schema
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v2.1.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
          github-token: ${{ github.token }}
      - name: Apply every migration to a fresh local Supabase database
        run: supabase db start
      - name: Assert the server identity can reach every table
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-service-role-table-authority.sql
      - name: Assert account-deletion certificate retention contract
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-account-deletion-certificate-retention.sql
      - name: Assert scheduled releases actually materialize
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-release-materialization.sql
      - name: Assert the payout write surface stays server-owned
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-payout-surface.sql
      - name: Assert purchase, ledger, entitlement and refund lifecycle
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-commerce-ledger-lifecycle.sql
      - name: Assert Stripe webhook claim, dead-letter and replay lifecycle
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-stripe-webhook-claim-lifecycle.sql
      - name: Assert unfinished ownership transfer mutations remain disabled for GA
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-ownership-transfer-ga-disabled.sql
      - name: Assert browser roles hold no privilege RLS cannot restrain
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-browser-role-truncate.sql
      - name: Rebuild hardened ISBN schema from verified legacy staging shape
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-legacy-staging-isbn-convergence.sql
      - name: Assert ISBN governance, RLS and transactional mint contract
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-isbn-governance-db-security.sql
      - name: Assert independent ISBN provenance review separation
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-isbn-independent-review.sql
      - name: Apply and verify Lovable ISBN final-invariants convergence delta
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-lovable-isbn-final-invariants.sql
      - name: Re-assert ISBN governance after Lovable convergence delta
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-isbn-governance-db-security.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-isbn-independent-review.sql
      - name: Apply and behaviorally verify Lovable publication-attestation authority delta
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-lovable-attestation-authority.sql
      - name: Assert atomic book-generation quota reservation contract
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-book-generation-quota-db-security.sql
      - name: Assert durable rate limit and stale-job sweeper contract
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-rate-limit-and-sweeper-db-security.sql
      - name: Assert Germany publication-compliance security contract
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-de-publication-compliance.sql
      - name: Fail on PostgreSQL function and schema errors
        run: supabase db lint --local --schema public --level error --fail-on error

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Node type dependencies used by Edge Function declarations
        run: bun install --frozen-lockfile
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Verify frozen Edge dependency lock
        shell: bash
        run: |
          set -euo pipefail
          cd supabase/functions
          mapfile -d '' entries < <(find . -type f -name '*.ts' -print0 | sort -z)
          test "${#entries[@]}" -gt 0
          deno install --config deno.json --entrypoint --lockfile-only --frozen "${entries[@]}"
      - name: Type-check shared Edge boundary and error tracking
        run: |
          deno check supabase/functions/_shared/error-tracking.ts
          deno check supabase/functions/_shared/http.ts
          deno check supabase/functions/_shared/figure-data.ts
          deno check supabase/functions/_shared/figure-layout.ts
          deno check supabase/functions/_shared/figure-export.ts
          deno check supabase/functions/_shared/cron-auth.ts
          deno check supabase/functions/_shared/stripe-connect.ts
      - name: Type-check critical financial Edge Functions
        run: |
          deno check supabase/functions/create-checkout/index.ts
          deno check supabase/functions/customer-portal/index.ts
          deno check supabase/functions/check-subscription/index.ts
          deno check supabase/functions/stripe-webhook/index.ts
          deno check supabase/functions/stripe-connect-onboarding/index.ts
      - name: Type-check authority and metered usage Edge Functions
        run: |
          deno check supabase/functions/claim-admin/index.ts
          deno check supabase/functions/delete-account/index.ts
          deno check supabase/functions/text-to-speech/index.ts
          deno check supabase/functions/validate-certificate/index.ts
          deno check supabase/functions/verify-certificate/index.ts
          deno check supabase/functions/export-certificate/index.ts
      - name: Type-check publication pipeline Edge Functions
        run: |
          deno check supabase/functions/generate-book/index.ts
          deno check supabase/functions/generate-chapter/index.ts
          deno check supabase/functions/generate-cover/index.ts
          deno check supabase/functions/generate-cover-raw/index.ts
          deno check supabase/functions/process-document/index.ts
          deno check supabase/functions/register-custom-cover/index.ts
          deno check supabase/functions/chief-editor-audit/index.ts
          deno check supabase/functions/proofread-chapter/index.ts
          deno check supabase/functions/deep-research/index.ts
          deno check supabase/functions/generate-references/index.ts
          deno check supabase/functions/verify-references/index.ts
          deno check supabase/functions/qa-publishability-audit/index.ts
          deno check supabase/functions/cross-chapter-consistency-audit/index.ts
          deno check supabase/functions/certify-asset-rights/index.ts
          deno check supabase/functions/certify-production-render/index.ts
          deno check supabase/functions/finalize-publication-certification/index.ts
          deno check supabase/functions/publishing-identity/index.ts
          deno check supabase/functions/isbn-admin-state/index.ts
          deno check supabase/functions/publish-work/index.ts
          deno check supabase/functions/materialize-release-schedules/index.ts
          deno check supabase/functions/enqueue-export-bundle/index.ts
          deno check supabase/functions/export-book/index.ts
          deno check supabase/functions/distribution-metadata/index.ts
          deno check supabase/functions/export-onix/index.ts
          deno check supabase/functions/de-publication-compliance/index.ts
          deno check supabase/functions/resolve-scroll-id/index.ts
          deno check supabase/functions/scrollvision-retrieve/index.ts
      - name: Type-check storefront, telemetry and moderation Edge Functions
        run: |
          deno check supabase/functions/storefront-user-api/index.ts
          deno check supabase/functions/record-purchase-intent/index.ts
          deno check supabase/functions/suggest-publishing-metadata/index.ts
          deno check supabase/functions/content-filter/index.ts
          deno check supabase/functions/grade-think-answer/index.ts
          deno check supabase/functions/attribution-tag/index.ts
          deno check supabase/functions/log-search-query/index.ts
          deno check supabase/functions/log-storefront-event/index.ts
          deno check supabase/functions/log-recommendation-feedback/index.ts
      - name: Test financial alerting contract
        run: |
          deno test supabase/functions/_shared/observability_test.ts
      - name: Test publication trust engines
        run: |
          deno test supabase/functions/_shared/isbn_test.ts
          deno test supabase/functions/_shared/scroll-identity_test.ts
          deno test supabase/functions/_shared/onix_test.ts
          deno test supabase/functions/_shared/structuralConsistency_test.ts
          deno test supabase/functions/_shared/assetRights_test.ts
          deno test supabase/functions/_shared/productionArtifactAudit_test.ts
          deno test supabase/functions/_shared/kdp-print-cover_test.ts
          deno test supabase/functions/_shared/kdp-cover-resolution_test.ts
      - name: Test editorial coverage, copyediting and illustration safety
        run: |
          deno test supabase/functions/_shared/audit-excerpt_test.ts
          deno test supabase/functions/_shared/proofread_test.ts
          deno test supabase/functions/_shared/visual-intelligence_test.ts
          deno test supabase/functions/_shared/figure-data_test.ts
          deno test supabase/functions/_shared/figure-layout_test.ts
          deno test supabase/functions/_shared/figure-export_test.ts
          deno test supabase/functions/_shared/cron-auth_test.ts
          deno test supabase/functions/_shared/stripe-connect_test.ts

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build immutable release artifact and enforce bundle budgets
        run: bun run build:release
      - name: Upload commit-addressed release artifact
        uses: actions/upload-artifact@v6
        with:
          name: web-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CI_SUPABASE_PUBLISHABLE_KEY || 'ci-public-placeholder' }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Install Chromium and operating-system dependencies
        run: bunx playwright install --with-deps chromium
      - name: Run deterministic browser smoke tests
        run: bun run test:e2e
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Reject committed high-confidence secrets
        run: bun run audit:secrets
      - name: Reject per-instance rate limiting on metered endpoints
        run: bun run audit:rate-limits
      - name: Require compensating auth on verify_jwt=false Edge Functions
        run: bun run audit:edge-auth
      - name: Reject orphaned Edge Functions
        run: bun run audit:function-reachability
      - name: Reject high or critical production dependency vulnerabilities
        run: bun run audit:dependencies
