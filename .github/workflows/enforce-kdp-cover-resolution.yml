name: Enforce KDP cover resolution
on:
  push:
    branches: [main]
    paths:
      - scripts/enforce-kdp-cover-resolution.mjs
      - .github/workflows/enforce-kdp-cover-resolution.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/enforce-kdp-cover-resolution.mjs
      - name: Commit KDP resolution enforcement
        run: |
          if git diff --quiet; then
            echo "No source change produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/enqueue-export-bundle/index.ts
          git commit -m "fix(kdp): enforce 300-DPI canonical cover preflight"
          git pull --rebase origin main
          git push origin HEAD:main
