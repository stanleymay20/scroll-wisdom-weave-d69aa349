name: Storage Boundary Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: storage-boundary-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_CLI_VERSION: 2.111.0

jobs:
  storage-owner-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
          github-token: ${{ github.token }}
      - name: Apply every migration to a fresh local Supabase database
        run: supabase db start
      - name: Assert storage writes stay owner/service-role bound
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-storage-owner-boundary.sql
      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup || true
