name: Sentry Dependency Remediation

on:
  push:
    branches:
      - claude/scroll-wisdom-weave-review-mtckux

permissions:
  contents: write

jobs:
  pin-sentry-react:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: claude/scroll-wisdom-weave-review-mtckux
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - name: Add exact Sentry React SDK and refresh lockfile
        run: bun add @sentry/react@10.74.0 --exact
      - name: Commit dependency lock update
        run: |
          if git diff --quiet -- package.json bun.lock; then
            echo "No dependency changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "deps: pin Sentry React SDK"
          git push origin HEAD:claude/scroll-wisdom-weave-review-mtckux
