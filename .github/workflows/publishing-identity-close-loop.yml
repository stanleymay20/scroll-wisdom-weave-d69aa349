name: Publishing identity close-loop patch

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-publishing-identity-close-loop.mjs
      - .github/workflows/publishing-identity-close-loop.yml

permissions:
  contents: write

concurrency:
  group: publishing-identity-close-loop-main
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply fail-fast repository patch
        run: node scripts/apply-publishing-identity-close-loop.mjs
      - name: Commit source integration to main
        run: |
          if git diff --quiet; then
            echo "No changes produced" >&2
            exit 1
          fi
          # Workflow files need a separate authenticated permission path. Keep
          # this one-shot bot strictly source-only; CI is updated directly.
          git checkout -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src supabase
          git commit -m "feat(publishing): integrate canonical identity across exports"
          git pull --rebase origin main
          git push origin HEAD:main
