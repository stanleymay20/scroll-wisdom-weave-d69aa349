name: ScrollUniversity Load Test

on:
  workflow_dispatch:
    inputs:
      target_vus:
        description: Peak concurrent virtual users
        required: true
        default: '100'
        type: choice
        options:
          - '100'
          - '250'
          - '500'
          - '1000'
      hold_duration:
        description: Duration to hold peak concurrency
        required: true
        default: '2m'
        type: choice
        options:
          - '1m'
          - '2m'
          - '5m'
          - '10m'

permissions:
  contents: read

concurrency:
  group: scroll-university-staging-load
  cancel-in-progress: false

jobs:
  load-test:
    name: ${{ inputs.target_vus }} VU university staging profile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      SUPABASE_URL: ${{ secrets.UNIVERSITY_LOAD_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.UNIVERSITY_LOAD_ANON_KEY }}
      UNIVERSITY_JWT: ${{ secrets.UNIVERSITY_LOAD_JWT }}
      TARGET_VUS: ${{ inputs.target_vus }}
      HOLD_DURATION: ${{ inputs.hold_duration }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Require staging-only load credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "UNIVERSITY_LOAD_SUPABASE_URL is not configured" >&2; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "UNIVERSITY_LOAD_ANON_KEY is not configured" >&2; exit 1; }
          test -n "$UNIVERSITY_JWT" || { echo "UNIVERSITY_LOAD_JWT is not configured" >&2; exit 1; }

      - name: Refuse obvious production targets
        shell: bash
        run: |
          set -euo pipefail
          case "$SUPABASE_URL" in
            *prod*|*production*)
              echo "Refusing to run the university load profile against a production-labelled target." >&2
              exit 1
              ;;
          esac

      - name: Run ScrollUniversity concurrency profile
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e SUPABASE_URL \
            -e SUPABASE_ANON_KEY \
            -e UNIVERSITY_JWT \
            -e TARGET_VUS \
            -e HOLD_DURATION \
            -v "$PWD:/work" \
            -w /work \
            grafana/k6:0.54.0 \
            run tests/load/scroll-university.k6.js
