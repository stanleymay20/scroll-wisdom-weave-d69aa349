name: Admin CORS Remediation

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: admin-cors-remediation-${{ github.ref }}
  cancel-in-progress: true

env:
  DENO_VERSION: 2.9.6
  WORK_BRANCH: claude/scroll-wisdom-weave-review-mtckux

jobs:
  harden-admin-cors:
    if: github.event.pull_request.head.ref == 'claude/scroll-wisdom-weave-review-mtckux'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.WORK_BRANCH }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Preload frozen Edge dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cd supabase/functions
          mapfile -d '' entries < <(find . -type f -name '*.ts' -print0 | sort -z)
          test "${#entries[@]}" -gt 0
          deno install --config deno.json --entrypoint --lockfile-only --frozen "${entries[@]}"
      - name: Apply exact-origin admin boundary
        run: |
          set -euo pipefail
          python3 scripts/remediate-admin-cors.py
          deno check --config supabase/functions/deno.json supabase/functions/_shared/admin-cors.ts
          deno check --config supabase/functions/deno.json supabase/functions/admin-refund-purchase/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/admin-force-stripe-resync/index.ts
          deno test --config supabase/functions/deno.json supabase/functions/_shared/admin-cors_test.ts
      - name: Commit only the two endpoint boundary changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/admin-refund-purchase/index.ts supabase/functions/admin-force-stripe-resync/index.ts
          git diff --cached --check
          git commit -m "harden: enforce exact-origin CORS on admin money paths"
          git push origin "HEAD:${WORK_BRANCH}"
