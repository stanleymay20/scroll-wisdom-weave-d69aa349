name: Temporary dev-tooling closure repair

on:
  push:
    branches:
      - security/dev-tooling-production-closure-20261004

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/dev-tooling-production-closure-20261004
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - name: Classify build and test tooling as development-only
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const names = [
            '@playwright/test',
            '@rollup/plugin-terser',
            'vite-plugin-pwa',
            'vitest',
            'workbox-build',
          ];
          pkg.devDependencies ||= {};
          for (const name of names) {
            if (pkg.dependencies?.[name]) {
              pkg.devDependencies[name] = pkg.dependencies[name];
              delete pkg.dependencies[name];
            }
          }
          pkg.dependencies = Object.fromEntries(Object.entries(pkg.dependencies || {}).sort(([a],[b]) => a.localeCompare(b)));
          pkg.devDependencies = Object.fromEntries(Object.entries(pkg.devDependencies || {}).sort(([a],[b]) => a.localeCompare(b)));
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
      - name: Regenerate Bun lockfile with pinned Bun
        run: bun install
      - name: Prove frozen lockfile
        run: bun install --frozen-lockfile
      - name: Prove production dependency audit
        run: bun run audit:dependencies
      - name: Commit deterministic package metadata
        run: |
          if git diff --quiet -- package.json bun.lock; then
            echo 'No package metadata changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock
          git commit -m 'Security: remove build and test tooling from production closure'
          git push origin HEAD:security/dev-tooling-production-closure-20261004
