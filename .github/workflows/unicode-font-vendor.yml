name: Vendor Unicode KDP Fonts

on:
  push:
    branches:
      - fix/unicode-safe-pdf-kdp-clean
    paths:
      - .github/workflows/unicode-font-vendor.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/unicode-safe-pdf-kdp-clean
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - name: Generate deterministic embedded font payloads
        run: |
          set -euo pipefail
          src="node_modules/dejavu-fonts-ttf/ttf"
          out="supabase/functions/_shared"
          license_dir="$out/fonts"
          mkdir -p "$license_dir"

          regular_sha="$(sha256sum "$src/DejaVuSans.ttf" | awk '{print $1}')"
          bold_sha="$(sha256sum "$src/DejaVuSans-Bold.ttf" | awk '{print $1}')"

          gzip -9 -n -c "$src/DejaVuSans.ttf" > /tmp/dejavu-regular.ttf.gz
          gzip -9 -n -c "$src/DejaVuSans-Bold.ttf" > /tmp/dejavu-bold.ttf.gz
          regular_b64="$(base64 -w0 /tmp/dejavu-regular.ttf.gz)"
          bold_b64="$(base64 -w0 /tmp/dejavu-bold.ttf.gz)"

          cat > "$out/pdf-unicode-font-data.ts" <<EOF
          // GENERATED FILE. Source: dejavu-fonts-ttf@2.37.3.
          // Payloads are deterministic gzip (-9 -n) of the original TTF files.
          // Source SHA-256 regular: $regular_sha
          // Source SHA-256 bold:    $bold_sha
          export const DEJAVU_SANS_REGULAR_GZIP_BASE64 = "$regular_b64";
          export const DEJAVU_SANS_BOLD_GZIP_BASE64 = "$bold_b64";
          EOF

          cp node_modules/dejavu-fonts-ttf/LICENSE "$license_dir/DEJAVU-LICENSE.txt"
          cat > "$license_dir/SOURCE_SHA256SUMS.txt" <<EOF
          $regular_sha  DejaVuSans.ttf
          $bold_sha  DejaVuSans-Bold.ttf
          EOF

          rm -f "$license_dir/DejaVuSans.ttf" "$license_dir/DejaVuSans-Bold.ttf" "$license_dir/SHA256SUMS.txt"

          # The package is needed only to generate the reviewed embedded payload.
          # Runtime no longer depends on filesystem assets from node_modules.
          bun remove dejavu-fonts-ttf
      - name: Commit only generated font payload/provenance and lock cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A package.json bun.lock \
            supabase/functions/_shared/pdf-unicode-font-data.ts \
            supabase/functions/_shared/fonts
          unexpected="$(git diff --cached --name-only | grep -vE '^(package.json|bun.lock|supabase/functions/_shared/pdf-unicode-font-data.ts|supabase/functions/_shared/fonts/(DEJAVU-LICENSE.txt|SOURCE_SHA256SUMS.txt|DejaVuSans.ttf|DejaVuSans-Bold.ttf|SHA256SUMS.txt))$' || true)"
          test -z "$unexpected"
          git commit -m "Embed licensed KDP Unicode font payloads"
          git push origin HEAD:fix/unicode-safe-pdf-kdp-clean
