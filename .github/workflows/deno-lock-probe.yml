name: Deno Lock Materialization

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: deno-lock-materialization-${{ github.ref }}
  cancel-in-progress: true

env:
  DENO_VERSION: 2.9.6
  WORK_BRANCH: claude/scroll-wisdom-weave-review-mtckux

jobs:
  materialize-lock:
    if: github.event.pull_request.head.ref == 'claude/scroll-wisdom-weave-review-mtckux'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.WORK_BRANCH }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Generate reviewed scoped Edge Function lockfile
        shell: bash
        run: |
          set -euo pipefail
          cd supabase/functions
          cat > deno.json <<'JSON'
          {
            "lock": {
              "path": "./deno.lock",
              "frozen": false
            },
            "nodeModulesDir": "none"
          }
          JSON
          mapfile -d '' entries < <(find . -type f -name '*.ts' -print0 | sort -z)
          test "${#entries[@]}" -gt 0
          deno install --config deno.json --entrypoint --lockfile-only --frozen=false "${entries[@]}"
          test -s deno.lock
          python3 - <<'PY'
          import json
          from pathlib import Path
          lock = Path('deno.lock')
          data = json.loads(lock.read_text())
          assert data.get('version') == '5', data.get('version')
          assert len(data.get('remote', {})) > 0
          assert len(data.get('npm', {})) > 0
          Path('deno.json').write_text('''{\n  "lock": {\n    "path": "./deno.lock",\n    "frozen": true\n  },\n  "nodeModulesDir": "none"\n}\n''')
          print('lockfile version:', data.get('version'))
          print('remote entries:', len(data.get('remote', {})))
          print('npm entries:', len(data.get('npm', {})))
          PY
      - name: Commit lock to the approved work branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/deno.json supabase/functions/deno.lock
          if git diff --cached --quiet; then
            echo "Reviewed Deno lock already materialized."
            exit 0
          fi
          git commit -m "deps: pin Supabase Edge dependency graph"
          git push origin "HEAD:${WORK_BRANCH}"
