name: Unicode Interior Build

on:
  push:
    branches:
      - fix/unicode-safe-pdf-interior
    paths:
      - .github/workflows/unicode-interior-build.yml

permissions:
  contents: write

jobs:
  build-slice:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/unicode-safe-pdf-interior
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - name: Install locked repository dependencies
        run: bun install --frozen-lockfile
      - name: Generate deterministic DejaVu interior font payloads
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cd "$tmp"
          pkg="$(npm pack dejavu-fonts-ttf@2.37.3 --silent)"
          tar -xzf "$pkg"
          src="$tmp/package/ttf"
          out="$GITHUB_WORKSPACE/supabase/functions/_shared/pdf-unicode-font-data.ts"
          sums="$GITHUB_WORKSPACE/supabase/functions/_shared/fonts/SOURCE_SHA256SUMS.txt"

          regular="$src/DejaVuSans.ttf"
          bold="$src/DejaVuSans-Bold.ttf"
          italic="$src/DejaVuSans-Oblique.ttf"
          bolditalic="$src/DejaVuSans-BoldOblique.ttf"
          mono="$src/DejaVuSansMono.ttf"
          for f in "$regular" "$bold" "$italic" "$bolditalic" "$mono"; do test -s "$f"; done

          regular_sha="$(sha256sum "$regular" | awk '{print $1}')"
          bold_sha="$(sha256sum "$bold" | awk '{print $1}')"
          italic_sha="$(sha256sum "$italic" | awk '{print $1}')"
          bolditalic_sha="$(sha256sum "$bolditalic" | awk '{print $1}')"
          mono_sha="$(sha256sum "$mono" | awk '{print $1}')"

          {
            echo '// GENERATED FILE. Source: dejavu-fonts-ttf@2.37.3.'
            echo '// Payloads are deterministic gzip (-9 -n) of the original TTF files.'
            echo "// Source SHA-256 regular:    $regular_sha"
            echo "// Source SHA-256 bold:       $bold_sha"
            echo "// Source SHA-256 italic:     $italic_sha"
            echo "// Source SHA-256 boldItalic: $bolditalic_sha"
            echo "// Source SHA-256 mono:       $mono_sha"
            printf 'export const DEJAVU_SANS_REGULAR_GZIP_BASE64 = "'
            gzip -9 -n -c "$regular" | base64 -w0
            echo '";'
            printf 'export const DEJAVU_SANS_BOLD_GZIP_BASE64 = "'
            gzip -9 -n -c "$bold" | base64 -w0
            echo '";'
            printf 'export const DEJAVU_SANS_OBLIQUE_GZIP_BASE64 = "'
            gzip -9 -n -c "$italic" | base64 -w0
            echo '";'
            printf 'export const DEJAVU_SANS_BOLD_OBLIQUE_GZIP_BASE64 = "'
            gzip -9 -n -c "$bolditalic" | base64 -w0
            echo '";'
            printf 'export const DEJAVU_SANS_MONO_GZIP_BASE64 = "'
            gzip -9 -n -c "$mono" | base64 -w0
            echo '";'
          } > "$out"

          cat > "$sums" <<EOF
          $regular_sha  DejaVuSans.ttf
          $bold_sha  DejaVuSans-Bold.ttf
          $italic_sha  DejaVuSans-Oblique.ttf
          $bolditalic_sha  DejaVuSans-BoldOblique.ttf
          $mono_sha  DejaVuSansMono.ttf
          EOF

          # Preserve the two already-reviewed core source hashes exactly.
          grep -q '^7da195a74c55bef988d0d48f9508bd5d849425c1770dba5d7bfc6ce9ed848954  DejaVuSans.ttf$' "$sums"
          grep -q '^e6476c1b80502924294eed40894c5b18e06c181444ca953e5334262df9c27724  DejaVuSans-Bold.ttf$' "$sums"
      - name: Expand Unicode font helper for interior styles
        shell: bash
        run: |
          set -euo pipefail
          cat > supabase/functions/_shared/pdf-unicode-fonts.ts <<'TS'
          /* eslint-disable @typescript-eslint/no-explicit-any -- pdf-lib/fontkit monkey-patching crosses an intentionally dynamic runtime boundary. */
          import fontkit from "npm:@pdf-lib/fontkit@1.1.1";
          import bidiFactoryImport from "npm:bidi-js@1.1.0";
          import {
            DEJAVU_SANS_BOLD_GZIP_BASE64,
            DEJAVU_SANS_BOLD_OBLIQUE_GZIP_BASE64,
            DEJAVU_SANS_MONO_GZIP_BASE64,
            DEJAVU_SANS_OBLIQUE_GZIP_BASE64,
            DEJAVU_SANS_REGULAR_GZIP_BASE64,
          } from "./pdf-unicode-font-data.ts";
          import {
            assertPdfGlyphCoverage,
            containsRtlScript,
            normalizePdfText,
          } from "./pdf-unicode.ts";

          export interface UnicodePdfFonts {
            regular: any;
            bold: any;
            sans: any;
            sansBold: any;
          }

          export interface UnicodePdfInteriorFonts extends UnicodePdfFonts {
            italic: any;
            boldItalic: any;
            mono: any;
          }

          interface BidiApi {
            getEmbeddingLevels(text: string): unknown;
            getReorderedString(text: string, levels: unknown): string;
          }

          type BidiFactory = () => BidiApi;
          type BidiFactoryModule = BidiFactory | { default: BidiFactory };

          const bidiFactoryModule = bidiFactoryImport as unknown as BidiFactoryModule;
          const createBidi: BidiFactory = typeof bidiFactoryModule === "function"
            ? bidiFactoryModule
            : bidiFactoryModule.default;
          const bidi = createBidi();
          const GUARDED_PAGE = Symbol("scrolllibrary-unicode-pdf-page");

          let coreFontBytesPromise: Promise<{
            regular: Uint8Array;
            bold: Uint8Array;
          }> | null = null;
          let interiorFontBytesPromise: Promise<{
            italic: Uint8Array;
            boldItalic: Uint8Array;
            mono: Uint8Array;
          }> | null = null;

          function decodeBase64(base64: string): Uint8Array {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
            return bytes;
          }

          async function gunzipBase64(base64: string): Promise<Uint8Array> {
            const compressed = decodeBase64(base64);
            const compressedBuffer = new ArrayBuffer(compressed.byteLength);
            new Uint8Array(compressedBuffer).set(compressed);
            const decompressed = new Blob([compressedBuffer])
              .stream()
              .pipeThrough(new DecompressionStream("gzip"));
            return new Uint8Array(await new Response(decompressed).arrayBuffer());
          }

          async function loadCoreFontBytes() {
            if (!coreFontBytesPromise) {
              coreFontBytesPromise = Promise.all([
                gunzipBase64(DEJAVU_SANS_REGULAR_GZIP_BASE64),
                gunzipBase64(DEJAVU_SANS_BOLD_GZIP_BASE64),
              ]).then(([regular, bold]) => ({ regular, bold }));
            }
            return await coreFontBytesPromise;
          }

          async function loadInteriorFontBytes() {
            if (!interiorFontBytesPromise) {
              interiorFontBytesPromise = Promise.all([
                gunzipBase64(DEJAVU_SANS_OBLIQUE_GZIP_BASE64),
                gunzipBase64(DEJAVU_SANS_BOLD_OBLIQUE_GZIP_BASE64),
                gunzipBase64(DEJAVU_SANS_MONO_GZIP_BASE64),
              ]).then(([italic, boldItalic, mono]) => ({ italic, boldItalic, mono }));
            }
            return await interiorFontBytesPromise;
          }

          export function preparePdfVisualText(text: string): string {
            const normalized = normalizePdfText(text);
            if (!containsRtlScript(normalized)) return normalized;
            const levels = bidi.getEmbeddingLevels(normalized);
            return bidi.getReorderedString(normalized, levels);
          }

          function guardPdfPage(page: any): any {
            if (!page || page[GUARDED_PAGE]) return page;

            const originalDrawText = page.drawText.bind(page);
            page.drawText = (text: string, options: Record<string, any> = {}) => {
              const normalized = normalizePdfText(String(text ?? ""));
              const font = options.font;
              if (font && typeof font.getCharacterSet === "function") {
                assertPdfGlyphCoverage(normalized, font, `PDF text ${JSON.stringify(normalized.slice(0, 80))}`);
              }
              return originalDrawText(preparePdfVisualText(normalized), options);
            };

            Object.defineProperty(page, GUARDED_PAGE, { value: true });
            return page;
          }

          export function installUnicodePdfTextGuard(pdfDoc: any): void {
            for (const page of pdfDoc.getPages?.() ?? []) guardPdfPage(page);

            const originalAddPage = pdfDoc.addPage.bind(pdfDoc);
            pdfDoc.addPage = (...args: any[]) => guardPdfPage(originalAddPage(...args));
          }

          /** Cover-only font set: preserves the already-qualified regular/bold path. */
          export async function embedUnicodePdfFonts(pdfDoc: any): Promise<UnicodePdfFonts> {
            pdfDoc.registerFontkit(fontkit);
            const bytes = await loadCoreFontBytes();
            const [regular, bold] = await Promise.all([
              pdfDoc.embedFont(bytes.regular, { subset: true }),
              pdfDoc.embedFont(bytes.bold, { subset: true }),
            ]);
            return { regular, bold, sans: regular, sansBold: bold };
          }

          /**
           * Interior font set. Adds true italic, bold-italic and monospace faces
           * without making the cover renderer decompress or embed unused faces.
           */
          export async function embedUnicodePdfInteriorFonts(pdfDoc: any): Promise<UnicodePdfInteriorFonts> {
            pdfDoc.registerFontkit(fontkit);
            const [core, interior] = await Promise.all([loadCoreFontBytes(), loadInteriorFontBytes()]);
            const [regular, bold, italic, boldItalic, mono] = await Promise.all([
              pdfDoc.embedFont(core.regular, { subset: true }),
              pdfDoc.embedFont(core.bold, { subset: true }),
              pdfDoc.embedFont(interior.italic, { subset: true }),
              pdfDoc.embedFont(interior.boldItalic, { subset: true }),
              pdfDoc.embedFont(interior.mono, { subset: true }),
            ]);
            return {
              regular,
              bold,
              italic,
              boldItalic,
              mono,
              sans: regular,
              sansBold: bold,
            };
          }
          TS
      - name: Wire Unicode fonts into ordinary and KDP interior PDF renderers
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('supabase/functions/export-book/index.ts')
          s = p.read_text()

          old_import = 'import { PDFDocument, rgb, StandardFonts, PDFRawStream, pushGraphicsState, popGraphicsState, concatTransformationMatrix, drawObject } from "https://esm.sh/pdf-lib@1.17.1";'
          new_import = 'import { PDFDocument, rgb, PDFRawStream, pushGraphicsState, popGraphicsState, concatTransformationMatrix, drawObject } from "https://esm.sh/pdf-lib@1.17.1";'
          assert s.count(old_import) == 1, 'pdf-lib import shape drifted'
          s = s.replace(old_import, new_import, 1)

          anchor = 'import { resolvePrepublicationIdentity } from "../_shared/publishingIdentity.ts";\n'
          assert s.count(anchor) == 1, 'publishing identity import anchor drifted'
          s = s.replace(anchor, anchor + 'import { embedUnicodePdfInteriorFonts, installUnicodePdfTextGuard } from "../_shared/pdf-unicode-fonts.ts";\nimport { assertPdfGlyphCoverage, normalizePdfText } from "../_shared/pdf-unicode.ts";\n', 1)

          start_marker = '/**\n * Sanitize text for PDF WinAnsi encoding'
          end_marker = '/**\n * Sanitize text for HTML/XML output'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          assert start >= 0 and end > start, 'legacy PDF sanitizer block not found'
          replacement = '''/**\n * Normalize printable manuscript Unicode for PDF layout. Glyph support is\n * validated against the exact embedded font before measurement and drawing;\n * unsupported code points fail loudly instead of being transliterated/dropped.\n */\nfunction sanitizeForPDF(text: string): string {\n  return normalizePdfText(text);\n}\n\n'''
          s = s[:start] + replacement + s[end:]

          font_re = re.compile(
              r'  const pdfDoc = await PDFDocument\.create\(\);\n'
              r'  const timesRoman = await pdfDoc\.embedFont\(StandardFonts\.TimesRoman\);\n'
              r'  const timesRomanBold = await pdfDoc\.embedFont\(StandardFonts\.TimesRomanBold\);\n'
              r'  const timesRomanItalic = await pdfDoc\.embedFont\(StandardFonts\.TimesRomanItalic\);\n'
              r'  const timesRomanBoldItalic = await pdfDoc\.embedFont\(StandardFonts\.TimesRomanBoldItalic\);\n'
              r'  const helvetica = await pdfDoc\.embedFont\(StandardFonts\.Helvetica\);\n'
              r'  const courier = await pdfDoc\.embedFont\(StandardFonts\.Courier\);(?: // Monospace for code)?'
          )
          font_replacement = '''  const pdfDoc = await PDFDocument.create();\n  installUnicodePdfTextGuard(pdfDoc);\n  const unicodeFonts = await embedUnicodePdfInteriorFonts(pdfDoc);\n  const timesRoman = unicodeFonts.regular;\n  const timesRomanBold = unicodeFonts.bold;\n  const timesRomanItalic = unicodeFonts.italic;\n  const timesRomanBoldItalic = unicodeFonts.boldItalic;\n  const helvetica = unicodeFonts.sans;\n  const courier = unicodeFonts.mono;'''
          s, count = font_re.subn(font_replacement, s)
          assert count == 3, f'expected 3 PDF font-init blocks, replaced {count}'

          measure_start = s.find('function measureCached(font: any, fontSize: number, word: string): number {')
          measure_end_marker = '\n\n// ── Fast image embedding'
          measure_end = s.find(measure_end_marker, measure_start)
          assert measure_start >= 0 and measure_end > measure_start, 'measureCached boundary drifted'
          measure_replacement = '''function measureCached(font: any, fontSize: number, word: string): number {\n  let cache = fontWidthCache.get(font);\n  if (!cache) {\n    cache = new Map<string, number>();\n    fontWidthCache.set(font, cache);\n  }\n  const key = `${fontSize}|${word}`;\n  let v = cache.get(key);\n  if (v === undefined) {\n    if (font && typeof font.getCharacterSet === "function") {\n      assertPdfGlyphCoverage(word, font, `PDF measurement ${JSON.stringify(word.slice(0, 80))}`);\n    }\n    v = font.widthOfTextAtSize(word, fontSize) as number;\n    if (cache.size < 100_000) cache.set(key, v);\n  }\n  return v;\n}'''
          s = s[:measure_start] + measure_replacement + s[measure_end:]

          old_comment = '''    // WinAnsi guard: pdf-lib standard fonts throw on any non-Latin-1 glyph\n    // (e.g. "ᵢ" U+1D62 from LaTeX subscripts). Sanitize before measure + draw.\n'''
          if old_comment in s:
              s = s.replace(old_comment, '    // Normalize printable Unicode before measuring; unsupported glyphs fail closed.\n', 1)

          assert s.count('async function generateKDPPDF(') == 1, 'KDP generator declaration drifted'
          s = s.replace('async function generateKDPPDF(', 'export async function generateKDPPDF(', 1)

          assert 'StandardFonts' not in s, 'StandardFonts remains in interior renderer'
          assert '_pdfCharMap' not in s, 'legacy transliteration map remains'
          assert s.count('embedUnicodePdfInteriorFonts(pdfDoc)') == 3, 'all three PDF renderers must use Unicode fonts'
          assert s.count('installUnicodePdfTextGuard(pdfDoc)') == 3, 'all three PDF renderers must install glyph guard'
          p.write_text(s)
          PY
      - name: Add interior Unicode regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/export-book/_test.ts')
          s = p.read_text()
          old = 'import { generateCanonicalPDF } from "./index.ts";'
          new = 'import { generateCanonicalPDF, generateKDPPDF } from "./index.ts";'
          assert s.count(old) == 1, 'canonical PDF import drifted'
          s = s.replace(old, new, 1)

          marker = '// =====================================================================\n// Canonical DOCX renderer tests'
          assert s.count(marker) == 1, 'DOCX test marker drifted'
          tests = r'''
          const UNICODE_PRINT_FIXTURE = "Akan ɛ ɔ · Greek α β · Math ∑ ∫ ≤ ≥ · Hebrew שלום";

          Deno.test("canonical PDF: Unicode print fixture renders without transliteration", async () => {
            const bytes = await renderPDF([
              {
                chapter_number: 1,
                title: `Unicode ${UNICODE_PRINT_FIXTURE}`,
                content: [
                  UNICODE_PRINT_FIXTURE,
                  "",
                  `**Bold ${UNICODE_PRINT_FIXTURE}**`,
                  `*Italic ${UNICODE_PRINT_FIXTURE}*`,
                  "",
                  "```text",
                  UNICODE_PRINT_FIXTURE,
                  "```",
                ].join("\n"),
              },
            ]);
            assertValidPDF(bytes);
          });

          Deno.test("canonical PDF: unsupported glyph fails loudly with exact codepoint", async () => {
            let thrown: unknown = null;
            try {
              await renderPDF([
                { chapter_number: 1, title: "Unsupported", content: "Unsupported glyph: 🧬" },
              ]);
            } catch (error) {
              thrown = error;
            }
            assert(thrown instanceof Error, "unsupported glyph must fail the export");
            assertEquals(thrown.name, "UnsupportedPdfGlyphError");
            assert(thrown.message.includes("U+1F9EC"), `missing exact codepoint in ${thrown.message}`);
          });

          async function renderKDPPDFForTest(content: string) {
            return await generateKDPPDF(
              makeBook({ title: `KDP ${UNICODE_PRINT_FIXTURE}` }),
              [{ chapter_number: 1, title: `Chapter ${UNICODE_PRINT_FIXTURE}`, content }],
              `Author ${UNICODE_PRINT_FIXTURE}`,
              "TEST-KDP-0001",
              false,
              2026,
              null,
              false,
              "APA",
              [],
              { width: 432, height: 648, name: '6" × 9"' },
              false,
              ctx,
            );
          }

          Deno.test("KDP interior PDF: Unicode print fixture renders through embedded fonts", async () => {
            const bytes = await renderKDPPDFForTest([
              UNICODE_PRINT_FIXTURE,
              "",
              `**Bold ${UNICODE_PRINT_FIXTURE}** and *italic ${UNICODE_PRINT_FIXTURE}*`,
            ].join("\n"));
            assertValidPDF(bytes);
          });

          Deno.test("KDP interior PDF: unsupported glyph fails loudly with exact codepoint", async () => {
            let thrown: unknown = null;
            try {
              await renderKDPPDFForTest("Unsupported glyph: 🧬");
            } catch (error) {
              thrown = error;
            }
            assert(thrown instanceof Error, "unsupported KDP glyph must fail the export");
            assertEquals(thrown.name, "UnsupportedPdfGlyphError");
            assert(thrown.message.includes("U+1F9EC"), `missing exact codepoint in ${thrown.message}`);
          });

          '''
          s = s.replace(marker, tests + marker, 1)
          p.write_text(s)
          PY
      - name: Verify static Unicode renderer invariants
        shell: bash
        run: |
          set -euo pipefail
          f=supabase/functions/export-book/index.ts
          test "$(grep -c 'embedUnicodePdfInteriorFonts(pdfDoc)' "$f")" -eq 3
          test "$(grep -c 'installUnicodePdfTextGuard(pdfDoc)' "$f")" -eq 3
          ! grep -q 'StandardFonts' "$f"
          ! grep -q '_pdfCharMap' "$f"
          grep -q 'return normalizePdfText(text);' "$f"
          grep -q 'assertPdfGlyphCoverage(word, font' "$f"
      - name: Type-check and run focused Unicode PDF tests
        shell: bash
        run: |
          set -euo pipefail
          deno check supabase/functions/export-book/index.ts
          deno test supabase/functions/_shared/kdp-print-cover_test.ts
          deno test --allow-net supabase/functions/export-book/_test.ts
      - name: Commit only intended slice and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/unicode-interior-map.yml .github/workflows/unicode-interior-build.yml
          git config user.name "Stanley Osei-Wusu"
          git config user.email "107648937+stanleymay20@users.noreply.github.com"
          git add \
            supabase/functions/_shared/pdf-unicode-font-data.ts \
            supabase/functions/_shared/pdf-unicode-fonts.ts \
            supabase/functions/_shared/fonts/SOURCE_SHA256SUMS.txt \
            supabase/functions/export-book/index.ts \
            supabase/functions/export-book/_test.ts \
            .github/workflows/unicode-interior-map.yml \
            .github/workflows/unicode-interior-build.yml
          git diff --cached --check
          git commit -m "Make PDF and KDP interior rendering Unicode-safe"
          git push origin HEAD:fix/unicode-safe-pdf-interior
