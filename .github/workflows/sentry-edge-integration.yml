name: Sentry Edge Integration

on:
  push:
    branches:
      - claude/scroll-wisdom-weave-review-mtckux

permissions:
  contents: write

jobs:
  wire-shared-http:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: claude/scroll-wisdom-weave-review-mtckux
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - name: Wire error tracking into shared Edge HTTP boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/_shared/http.ts')
          s = p.read_text()
          needle = 'import { z, ZodSchema } from "https://esm.sh/zod@3.23.8";\n'
          replacement = needle + 'import { captureEdgeException, initEdgeErrorTracking } from "./error-tracking.ts";\n\nawait initEdgeErrorTracking();\n'
          if 'initEdgeErrorTracking' not in s:
              if needle not in s:
                  raise SystemExit('http import anchor not found')
              s = s.replace(needle, replacement, 1)
          old = '''export function serverError(err: unknown, code = "internal_error"): Response {\n  const message = err instanceof Error ? err.message : "Unknown error";\n  // Avoid leaking stack traces to clients.\n  return json({ error: message, code }, 500);\n}\n'''
          new = '''export function serverError(err: unknown, code = "internal_error"): Response {\n  captureEdgeException(err, { surface: "shared-server-error", code });\n  const message = err instanceof Error ? err.message : "Unknown error";\n  // Avoid leaking stack traces to clients.\n  return json({ error: message, code }, 500);\n}\n'''
          if 'surface: "shared-server-error"' not in s:
              if old not in s:
                  raise SystemExit('serverError anchor not found')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Type-check Sentry Edge adapter and shared HTTP boundary
        run: |
          deno check supabase/functions/_shared/error-tracking.ts
          deno check supabase/functions/_shared/http.ts
      - name: Commit verified edge integration
        run: |
          if git diff --quiet -- supabase/functions/_shared/http.ts; then
            echo "No shared HTTP changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/http.ts
          git commit -m "feat: initialize Sentry at shared edge boundary"
          git push origin HEAD:claude/scroll-wisdom-weave-review-mtckux
