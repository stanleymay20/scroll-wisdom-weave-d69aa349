name: Controlled GA Gate Repair
# one-shot retrigger after corrected verification guard

on:
  push:
    branches:
      - repair/ga-gates-20260912
    paths:
      - package.json
      - e2e/real-reader-library.spec.ts
      - .github/workflows/controlled-ga-gate-repair.yml

permissions:
  contents: write

jobs:
  repair-lock-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/ga-gates-20260912
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Patch only the vulnerable xmldom lock resolution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("bun.lock")
          text = path.read_text()

          old_entry = '"@xmldom/xmldom": ["@xmldom/xmldom@0.8.11", "", {}, "sha512-cQzWCtO6C8TQiYl1ruKNn2U6Ao4o4WBBcbL61yJl84x+j5sOWWFU9X7DpND8XZG3daDppSsigMdfAIl2upQBRw=="]'
          new_entry = '"@xmldom/xmldom": ["@xmldom/xmldom@0.8.15", "", {}, "sha512-/5NV/vDALVFDXgLmfsy9TRCBlKwO2LNBFzpzvb9iIj+jR+eSc6DLYYvVOdivT/jm7MtU6TebYuRmzEOI7w40UA=="]'

          if text.count(old_entry) != 1:
              raise SystemExit(f"Expected exactly one xmldom 0.8.11 lock entry, found {text.count(old_entry)}")
          text = text.replace(old_entry, new_entry, 1)

          overrides = '  "overrides": {\n    "@xmldom/xmldom": "0.8.15",\n  },\n'
          marker = '  "packages": {\n'
          if '"overrides"' not in text:
              if text.count(marker) != 1:
                  raise SystemExit("Could not identify the Bun packages marker uniquely")
              text = text.replace(marker, overrides + marker, 1)

          path.write_text(text)
          PY

      - name: Guard generated change set
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "bun.lock" || {
            echo "Unexpected generated changes:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }

      - name: Verify frozen dependency graph
        run: bun install --frozen-lockfile

      - name: Dependency security gate
        run: bun run audit:dependencies

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit and integration tests
        run: bun run test

      - name: Production build
        run: bun run build:release

      - name: Confirm patched dependency
        shell: bash
        run: |
          grep -F '"@xmldom/xmldom": ["@xmldom/xmldom@0.8.15"' bun.lock
          ! grep -F '"@xmldom/xmldom": ["@xmldom/xmldom@0.8.11"' bun.lock

      - name: Commit lock repair and remove temporary writer
        shell: bash
        run: |
          rm .github/workflows/controlled-ga-gate-repair.yml
          git add bun.lock .github/workflows/controlled-ga-gate-repair.yml
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/controlled-ga-gate-repair.yml' 'bun.lock' | sort)"
          test "$changed" = "$expected" || {
            echo "Refusing to commit unexpected paths:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
          git config user.name "scrolllibrary-security-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "security: pin patched xmldom and remove temporary writer"
          git push origin HEAD:repair/ga-gates-20260912
