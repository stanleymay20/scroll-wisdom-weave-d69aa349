name: Strict Null Fixup

on:
  push:
    branches:
      - claude/scroll-wisdom-weave-review-mtckux

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: claude/scroll-wisdom-weave-review-mtckux
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - name: Apply exact pedagogical schema fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/pedagogicalSchema.ts')
          s = p.read_text()
          old = '  const tableRows = content.match(/\\|[^|\\n]+\\|/g) || [];'
          new = '  const tableRows: string[] = content.match(/\\|[^|\\n]+\\|/g) ?? [];'
          if old not in s:
              if new in s:
                  raise SystemExit(0)
              raise SystemExit('tableRows anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify src/lib strict null ratchet
        run: bun scripts/check-strict-null.mjs src/lib
      - name: Commit verified one-line fix
        run: |
          if git diff --quiet -- src/lib/pedagogicalSchema.ts; then
            echo "No change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/pedagogicalSchema.ts
          git commit -m "fix: make table audit strict-null safe"
          git push origin HEAD:claude/scroll-wisdom-weave-review-mtckux
