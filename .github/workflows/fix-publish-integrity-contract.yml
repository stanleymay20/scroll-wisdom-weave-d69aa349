name: Fix publication integrity contract

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-publish-integrity-contract.mjs
      - .github/workflows/fix-publish-integrity-contract.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/fix-publish-integrity-contract.mjs
      - name: Commit source repair
        run: |
          if git diff --quiet; then
            echo "No source change produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/publish-work/index.ts
          git commit -m "fix(publication): make published integrity server-owned"
          git pull --rebase origin main
          git push origin HEAD:main
