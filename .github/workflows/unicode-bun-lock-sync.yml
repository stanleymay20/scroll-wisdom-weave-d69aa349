name: Unicode Bun Lock Sync

on:
  push:
    branches:
      - fix/unicode-safe-pdf-kdp-clean
    paths:
      - .github/workflows/unicode-bun-lock-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/unicode-safe-pdf-kdp-clean
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - name: Add exact Unicode PDF runtime dependencies
        run: bun add --exact @pdf-lib/fontkit@1.1.1 bidi-js@1.1.0 dejavu-fonts-ttf@2.37.3
      - name: Commit generated manifest and lock only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          unexpected="$(git diff --cached --name-only | grep -vE '^(package.json|bun.lock)$' || true)"
          test -z "$unexpected"
          if git diff --cached --quiet; then
            echo "No dependency changes needed"
            exit 0
          fi
          git commit -m "Pin Unicode PDF runtime dependencies"
          git push origin HEAD:fix/unicode-safe-pdf-kdp-clean
