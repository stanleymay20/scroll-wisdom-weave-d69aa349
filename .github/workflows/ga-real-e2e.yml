name: GA Real E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ga-real-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.2.23
  SUPABASE_CLI_VERSION: 2.111.0
  E2E_USER_ONE_EMAIL: ga-e2e-one@example.test
  E2E_USER_ONE_PASSWORD: GaE2ePassword123!
  E2E_USER_TWO_EMAIL: ga-e2e-two@example.test
  E2E_USER_TWO_PASSWORD: GaE2ePassword456!

jobs:
  real-supabase-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v2.1.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
          github-token: ${{ github.token }}

      - name: Isolate disposable Supabase project and host ports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import socket
          from pathlib import Path

          path = Path("supabase/config.toml")
          text = path.read_text()

          # GA runs must not depend on Supabase's fixed localhost defaults. A
          # hosted runner can occasionally inherit an occupied default port
          # (for example 54322), which is infrastructure contention rather than
          # an application failure. Reserve a free contiguous block and give
          # this run a unique local project identity before `supabase start`.
          required_sections = ("[api]", "[db]", "[studio]", "[inbucket]", "[analytics]", "[edge_runtime]")
          present = [section for section in required_sections if section in text]
          if present:
              raise SystemExit(f"GA port isolation expects no root local-service sections; found: {present}")

          sockets = []
          base = None
          for candidate in range(55000, 64000, 20):
              trial = []
              try:
                  for port in range(candidate, candidate + 10):
                      sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                      sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 0)
                      sock.bind(("127.0.0.1", port))
                      trial.append(sock)
                  base = candidate
                  sockets = trial
                  break
              except OSError:
                  for sock in trial:
                      sock.close()

          if base is None:
              raise SystemExit("Unable to reserve an isolated local Supabase port block")

          for sock in sockets:
              sock.close()

          run_id = os.environ["GITHUB_RUN_ID"]
          attempt = os.environ.get("GITHUB_RUN_ATTEMPT", "1")
          project_id = f"scrolllibrary-ga-{run_id}-{attempt}"

          lines = text.splitlines()
          if not lines or not lines[0].startswith("project_id ="):
              raise SystemExit("Unexpected supabase/config.toml: project_id must be the first line")
          lines[0] = f'project_id = "{project_id}"'

          local_config = f'''\n\n# Ephemeral GA-only local service ports; injected by CI and never committed.\n[api]\nport = {base}\n\n[db]\nport = {base + 1}\nshadow_port = {base + 2}\n\n[studio]\nport = {base + 3}\n\n[inbucket]\nport = {base + 4}\nsmtp_port = {base + 5}\npop3_port = {base + 6}\n\n[analytics]\nport = {base + 7}\nvector_port = {base + 8}\n\n[edge_runtime]\ninspector_port = {base + 9}\n'''
          path.write_text("\n".join(lines) + local_config)
          print(f"Configured isolated Supabase project {project_id} on ports {base}-{base + 9}")
          PY

      - name: Start fully migrated local Supabase stack
        run: supabase start

      - name: Export disposable local Supabase credentials
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/scrolllibrary-supabase.env
          set -a
          source /tmp/scrolllibrary-supabase.env
          set +a

          PUBLIC_KEY="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          ADMIN_KEY="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          if [ -z "${API_URL:-}" ] || [ -z "$PUBLIC_KEY" ] || [ -z "$ADMIN_KEY" ] || [ -z "${DB_URL:-}" ]; then
            echo "Local Supabase did not expose the required API/public/admin/database credentials." >&2
            exit 1
          fi

          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLIC_KEY"
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_ANON_KEY=$PUBLIC_KEY"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$ADMIN_KEY"
            echo "E2E_DATABASE_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      - name: Seed isolated confirmed users and API-authorized canaries
        run: bun scripts/seed-ga-e2e.mjs

      - name: Seed reader ownership fixtures in disposable database
        run: psql "$E2E_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/seed-ga-reader-fixtures.sql

      - name: Install cross-browser Playwright runtimes
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Run real authentication and RLS browser E2E
        run: bunx playwright test --config=playwright.ga.config.ts

      - name: Upload GA E2E diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ga-real-e2e-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup || true
