name: GA Real E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ga-real-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BUN_VERSION: 1.2.23
  SUPABASE_CLI_VERSION: 2.111.0
  E2E_USER_ONE_EMAIL: ga-e2e-one@example.test
  E2E_USER_ONE_PASSWORD: GaE2ePassword123!
  E2E_USER_TWO_EMAIL: ga-e2e-two@example.test
  E2E_USER_TWO_PASSWORD: GaE2ePassword456!

jobs:
  real-supabase-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
          github-token: ${{ github.token }}

      - name: Isolate disposable Supabase project and host ports
        # GA runs must not depend on Supabase's fixed localhost defaults; see
        # the script for why.
        run: python3 scripts/ci/isolate-supabase-ports.py

      - name: Start fully migrated local Supabase stack
        run: supabase start

      - name: Export disposable local Supabase credentials
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/scrolllibrary-supabase.env
          set -a
          source /tmp/scrolllibrary-supabase.env
          set +a

          PUBLIC_KEY="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          ADMIN_KEY="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          if [ -z "${API_URL:-}" ] || [ -z "$PUBLIC_KEY" ] || [ -z "$ADMIN_KEY" ] || [ -z "${DB_URL:-}" ]; then
            echo "Local Supabase did not expose the required API/public/admin/database credentials." >&2
            exit 1
          fi

          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLIC_KEY"
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_ANON_KEY=$PUBLIC_KEY"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$ADMIN_KEY"
            echo "E2E_DATABASE_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      - name: Assert certificate retention database contract
        run: psql "$E2E_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/test-account-deletion-certificate-retention.sql

      - name: Exercise real account deletion and retained-certificate verification
        run: bun scripts/test-account-deletion-e2e.mjs

      - name: Seed isolated confirmed users and API-authorized canaries
        run: bun scripts/seed-ga-e2e.mjs

      - name: Seed reader ownership fixtures in disposable database
        run: psql "$E2E_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/seed-ga-reader-fixtures.sql

      - name: Exercise self-service data export lifecycle
        run: bun scripts/test-data-export-e2e.mjs

      - name: Exercise authoritative mastery certificate lifecycle
        run: bun scripts/test-mastery-certificate-e2e.mjs

      - name: Install cross-browser Playwright runtimes
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Run real authentication and RLS browser E2E
        run: bunx playwright test --config=playwright.ga.config.ts

      - name: Capture disposable stack logs on failure
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p ga-diagnostics

          # Edge Functions run inside `supabase start`'s own containers, so their
          # console output never reaches this job log. Every function here answers
          # a caller with a deliberately generic message — delete-account says
          # "contact support" rather than naming the tables it could not clear —
          # so when a step fails the actionable detail exists only in these logs
          # and is discarded when the stack stops. Capture it before that.
          for container in $(docker ps -aq --filter name=supabase_edge_runtime --filter name=supabase_db); do
            name=$(docker inspect -f '{{.Name}}' "$container" | tr -d '/')
            docker logs "$container" > "ga-diagnostics/$name.log" 2>&1 || true
            echo "::group::$name (last 200 lines)"
            tail -n 200 "ga-diagnostics/$name.log" || true
            echo "::endgroup::"
          done

      - name: Upload GA E2E diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ga-real-e2e-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            ga-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup || true
