name: University Credit Metadata Normalizer

on:
  push:
    branches:
      - feat/scroll-university-complete
    paths:
      - .github/workflows/university-credit-metadata-normalizer.yml
      - content/university/foundation-core-v1/**

permissions:
  contents: write

concurrency:
  group: university-credit-metadata-normalizer
  cancel-in-progress: false

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[metadata-normalized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/scroll-university-complete
          fetch-depth: 0

      - name: Replace bare ECTS labels with internal workload-unit metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const root = 'content/university/foundation-core-v1';
          const files = fs.readdirSync(root)
            .filter((name) => /^SU10[1-6]-.*\.json$/.test(name) || name === 'workload-and-practice.json')
            .map((name) => path.join(root, name));

          const replacement = '"credit_system": "ScrollUniversity workload units (ECTS workload benchmark only; not ECTS credit)"';
          let changed = 0;

          for (const file of files) {
            const original = fs.readFileSync(file, 'utf8');
            const updated = original.replace(/"credit_system"\s*:\s*"ECTS"/g, replacement);
            if (updated !== original) {
              fs.writeFileSync(file, updated);
              changed += 1;
            }
          }

          if (changed !== 7) {
            throw new Error(`Expected to normalize 7 files, normalized ${changed}`);
          }
          NODE

          if grep -R -n -E '"credit_system"[[:space:]]*:[[:space:]]*"ECTS"' content/university/foundation-core-v1; then
            echo 'Bare ECTS credit_system metadata remains.' >&2
            exit 1
          fi
          git diff --check

      - name: Commit normalized metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/university/foundation-core-v1
          git diff --cached --quiet && { echo 'No metadata changes to commit'; exit 0; }
          git commit -m 'fix(university): label credits as internal workload units [metadata-normalized]'
          git push origin HEAD:feat/scroll-university-complete
