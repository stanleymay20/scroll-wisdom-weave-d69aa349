name: Temporary Paid Model Floor Patch

on:
  push:
    branches:
      - fix/paid-model-quality-floor
    paths:
      - .github/workflows/tmp-paid-model-floor-patch.yml

permissions:
  contents: write

jobs:
  patch-handler:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/paid-model-quality-floor
          fetch-depth: 0
      - name: Apply deterministic handler patch
        run: node scripts/apply-paid-model-quality-floor.mjs
      - name: Verify patch changed only the intended handler
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- supabase/functions/generate-chapter/index.ts; then
            echo "Expected handler patch produced no diff" >&2
            exit 1
          fi
          changed="$(git diff --name-only)"
          test "$changed" = "supabase/functions/generate-chapter/index.ts"
      - name: Commit patched handler to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/generate-chapter/index.ts
          git commit -m "Enforce paid generation model quality floor"
          git push origin HEAD:fix/paid-model-quality-floor
