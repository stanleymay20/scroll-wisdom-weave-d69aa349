name: Fix export binary response

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-export-binary-response.mjs
      - .github/workflows/fix-export-binary-response.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply fail-fast binary response patch
        run: node scripts/fix-export-binary-response.mjs
      - name: Commit source repair to main
        run: |
          if git diff --quiet; then
            echo "No source change produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/export-book/index.ts
          git commit -m "fix(export): use ArrayBuffer for direct binary response"
          git pull --rebase origin main
          git push origin HEAD:main
