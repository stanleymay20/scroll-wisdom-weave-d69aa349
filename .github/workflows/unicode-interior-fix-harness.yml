name: Unicode Interior Harness Fix

on:
  push:
    branches:
      - fix/unicode-safe-pdf-interior
    paths:
      - .github/workflows/unicode-interior-fix-harness.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/unicode-safe-pdf-interior
      - name: Add pinned Deno setup and remove this temporary fixer
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/unicode-interior-build.yml')
          s = p.read_text()
          needle = '''      - uses: oven-sh/setup-bun@v2\n        with:\n          bun-version: 1.2.23\n'''
          insertion = needle + '''      - uses: denoland/setup-deno@v2\n        with:\n          deno-version: 2.9.6\n'''
          assert s.count(needle) == 1, 'Bun setup anchor drifted'
          assert 'denoland/setup-deno@v2' not in s, 'Deno setup already present'
          p.write_text(s.replace(needle, insertion, 1))
          PY
          rm .github/workflows/unicode-interior-fix-harness.yml
          git config user.name "Stanley Osei-Wusu"
          git config user.email "107648937+stanleymay20@users.noreply.github.com"
          git add .github/workflows/unicode-interior-build.yml .github/workflows/unicode-interior-fix-harness.yml
          git diff --cached --check
          git commit -m "Repair Unicode interior Deno test harness"
          git push origin HEAD:fix/unicode-safe-pdf-interior
