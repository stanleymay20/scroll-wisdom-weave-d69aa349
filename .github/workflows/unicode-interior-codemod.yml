name: Apply Unicode Interior Codemod

on:
  push:
    branches:
      - fix/unicode-safe-pdf-interior
    paths:
      - .github/workflows/unicode-interior-codemod.yml

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/unicode-safe-pdf-interior
      - name: Apply assertion-guarded renderer edit
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('supabase/functions/export-book/index.ts')
          text = path.read_text()

          old_pdf_import = 'import { PDFDocument, rgb, StandardFonts, PDFRawStream, pushGraphicsState, popGraphicsState, concatTransformationMatrix, drawObject } from "https://esm.sh/pdf-lib@1.17.1";'
          new_pdf_import = 'import { PDFDocument, rgb, PDFRawStream, pushGraphicsState, popGraphicsState, concatTransformationMatrix, drawObject } from "https://esm.sh/pdf-lib@1.17.1";'
          assert text.count(old_pdf_import) == 1, 'pdf-lib import boundary drifted'
          text = text.replace(old_pdf_import, new_pdf_import)

          anchor = 'import { resolvePrepublicationIdentity } from "../_shared/publishingIdentity.ts";'
          extra = '''import { resolvePrepublicationIdentity } from "../_shared/publishingIdentity.ts";
          import { embedUnicodePdfInteriorFonts, installUnicodePdfTextGuard } from "../_shared/pdf-unicode-fonts.ts";
          import { assertPdfGlyphCoverage, normalizePdfText } from "../_shared/pdf-unicode.ts";'''
          assert text.count(anchor) == 1, 'Unicode import anchor drifted'
          assert 'embedUnicodePdfInteriorFonts' not in text
          text = text.replace(anchor, extra)

          sanitizer_start = '/**\n * Sanitize text for PDF WinAnsi encoding — SINGLE-PASS character map'
          sanitizer_end = '/**\n * Sanitize text for HTML/XML output (EPUB/DOCX)'
          assert text.count(sanitizer_start) == 1, 'destructive sanitizer start drifted'
          assert text.count(sanitizer_end) == 1, 'sanitizer end drifted'
          a = text.index(sanitizer_start)
          b = text.index(sanitizer_end, a)
          replacement = '''/**
           * Normalize printable manuscript Unicode for embedded-font PDF rendering.
           * No transliteration or silent glyph deletion is permitted here. Unsupported
           * glyphs are rejected by the shared coverage guard with precise code points.
           */
          function sanitizeForPDF(text: string): string {
            return normalizePdfText(text);
          }

          '''
          text = text[:a] + replacement + text[b:]

          assert text.count('StandardFonts.') == 18, f'expected 18 StandardFonts refs, found {text.count("StandardFonts.")}'
          font_pattern = re.compile(
              r'  const timesRoman = await pdfDoc\.embedFont\(StandardFonts\.TimesRoman\);\n'
              r'  const timesRomanBold = await pdfDoc\.embedFont\(StandardFonts\.TimesRomanBold\);\n'
              r'  const timesRomanItalic = await pdfDoc\.embedFont\(StandardFonts\.TimesRomanItalic\);\n'
              r'  const timesRomanBoldItalic = await pdfDoc\.embedFont\(StandardFonts\.TimesRomanBoldItalic\);\n'
              r'  const helvetica = await pdfDoc\.embedFont\(StandardFonts\.Helvetica\);\n'
              r'  const courier = await pdfDoc\.embedFont\(StandardFonts\.Courier\);(?: // Monospace for code)?\n'
          )
          unicode_fonts = '''  installUnicodePdfTextGuard(pdfDoc);
            const unicodeFonts = await embedUnicodePdfInteriorFonts(pdfDoc);
            const timesRoman = unicodeFonts.regular;
            const timesRomanBold = unicodeFonts.bold;
            const timesRomanItalic = unicodeFonts.italic;
            const timesRomanBoldItalic = unicodeFonts.boldItalic;
            const helvetica = unicodeFonts.sans;
            const courier = unicodeFonts.mono;
          '''
          text, count = font_pattern.subn(unicode_fonts, text)
          assert count == 3, f'expected 3 font-init blocks, replaced {count}'
          assert 'StandardFonts.' not in text, 'StandardFonts reference survived'

          measure_pattern = re.compile(
              r'function measureCached\(font: any, fontSize: number, word: string\): number \{\n'
              r'.*?\n\}\n\n// ── Fast image embedding',
              re.S,
          )
          matches = list(measure_pattern.finditer(text))
          assert len(matches) == 1, f'measureCached boundary drifted: {len(matches)} matches'
          old_measure = matches[0].group(0)
          assert 'Last-resort WinAnsi guard' in old_measure, 'expected fallback guard missing'
          new_measure = '''function measureCached(font: any, fontSize: number, word: string): number {
            const normalized = sanitizeForPDF(word);
            assertPdfGlyphCoverage(
              normalized,
              font,
              `PDF measurement ${JSON.stringify(normalized.slice(0, 80))}`,
            );

            let cache = fontWidthCache.get(font);
            if (!cache) {
              cache = new Map<string, number>();
              fontWidthCache.set(font, cache);
            }
            const key = `${fontSize}|${normalized}`;
            let v = cache.get(key);
            if (v === undefined) {
              v = font.widthOfTextAtSize(normalized, fontSize) as number;
              if (cache.size < 100_000) cache.set(key, v);
            }
            return v;
          }

          // ── Fast image embedding'''
          text = text.replace(old_measure, new_measure)

          old_comment = '''    // WinAnsi guard: pdf-lib standard fonts throw on any non-Latin-1 glyph
              // (e.g. "ᵢ" U+1D62 from LaTeX subscripts). Sanitize before measure + draw.'''
          new_comment = '''    // Normalize printable Unicode before measure + draw; embedded fonts and
              // the shared guard fail loudly if a glyph is unsupported.'''
          assert text.count(old_comment) == 1, 'styled paragraph WinAnsi comment drifted'
          text = text.replace(old_comment, new_comment)

          assert text.count('sanitizeForPDF(') == 73, f'sanitizer call count changed unexpectedly: {text.count("sanitizeForPDF(")}'
          assert '_pdfCharMap' not in text, 'destructive character map survived'
          assert 'Last-resort WinAnsi guard' not in text, 'measurement fallback survived'
          assert text.count('installUnicodePdfTextGuard(pdfDoc);') == 3
          assert text.count('embedUnicodePdfInteriorFonts(pdfDoc)') == 3
          path.write_text(text)

          test_path = Path('supabase/functions/export-book/_test.ts')
          tests = test_path.read_text()
          marker = '// =====================================================================\n// Canonical DOCX renderer tests'
          assert tests.count(marker) == 1, 'canonical PDF test insertion marker drifted'
          assert 'canonical PDF: preserves required Unicode fixture and Hebrew' not in tests
          new_tests = r'''Deno.test("canonical PDF: preserves required Unicode fixture and Hebrew across styles", async () => {
            const bytes = await renderPDF([
              {
                chapter_number: 1,
                title: "Unicode",
                content: [
                  "Required Unicode: ɛ ɔ α β ∑ ∫ ≤ ≥ — שלום.",
                  "",
                  "**Bold ɛ α ∑** and *italic ɔ β שלום*.",
                  "",
                  "```txt",
                  "ɛ ɔ α β ∑ ∫ ≤ ≥",
                  "```",
                ].join("\n"),
              },
            ]);
            assertValidPDF(bytes, 5_000);
          });

          Deno.test("canonical PDF: unsupported glyph fails loudly instead of disappearing", async () => {
            let caught: unknown = null;
            try {
              await renderPDF([
                {
                  chapter_number: 1,
                  title: "Unsupported",
                  content: "This unsupported glyph must not disappear: 漢",
                },
              ]);
            } catch (error) {
              caught = error;
            }

            assert(caught instanceof Error, "unsupported glyph should reject the PDF export");
            assertEquals((caught as Error & { code?: string }).code, "PDF_UNSUPPORTED_GLYPH");
            assert(caught.message.includes("U+6F22"), `expected U+6F22 in error, got: ${caught.message}`);
          });

          '''
          tests = tests.replace(marker, new_tests + marker)
          test_path.write_text(tests)
          PY
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "supabase/functions/export-book/_test.ts supabase/functions/export-book/index.ts "
      - name: Commit only surgical interior renderer changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/export-book/index.ts supabase/functions/export-book/_test.ts
          git commit -m "Make PDF interiors Unicode-safe"
          git push origin HEAD:fix/unicode-safe-pdf-interior
