name: Temporary Unicode PDF Deno Lock Update

on:
  push:
    branches:
      - fix/unicode-safe-pdf-kdp
    paths:
      - .github/workflows/tmp-unicode-pdf-lock.yml

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/unicode-safe-pdf-kdp
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - name: Regenerate Edge dependency lock from every TypeScript entrypoint
        shell: bash
        run: |
          set -euo pipefail
          cd supabase/functions
          mapfile -d '' entries < <(find . -type f -name '*.ts' -print0 | sort -z)
          test "${#entries[@]}" -gt 0
          deno install --config deno.json --entrypoint --lockfile-only --frozen=false "${entries[@]}"
      - name: Verify only the Deno lock changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- supabase/functions/deno.lock; then
            echo "Expected Deno lock update produced no diff" >&2
            exit 1
          fi
          test "$(git diff --name-only)" = "supabase/functions/deno.lock"
      - name: Commit updated lock to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/deno.lock
          git commit -m "Lock Unicode PDF font dependencies"
          git push origin HEAD:fix/unicode-safe-pdf-kdp
