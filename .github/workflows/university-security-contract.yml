name: University Security Contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: university-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provisioning-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - name: Verify ScrollUniversity provisioning privilege boundary
        run: bun scripts/check-university-provisioning-security.mjs
