name: Rate Limit Remediation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rate-limit-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'claude/scroll-wisdom-weave-review-mtckux'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: claude/scroll-wisdom-weave-review-mtckux
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - name: Migrate generate-cover to durable rate limiting
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/generate-cover/index.ts')
          s = p.read_text()
          old_import = '  enforceRateLimit,\n} from "../_shared/http.ts";'
          new_import = '  enforceDurableRateLimit,\n} from "../_shared/http.ts";'
          assert s.count(old_import) == 1, 'generate-cover import drifted'
          s = s.replace(old_import, new_import)
          old = '''    const rate = enforceRateLimit({
              name: "generate-cover-provenance",
              key: auth.userId,
              limit: 5,
              windowSec: 60,
            });
            if (rate) return rate;

            const sc = serviceClient();'''.replace('          ', '')
          new = '''    const sc = serviceClient();
            const rate = await enforceDurableRateLimit(sc, {
              name: "generate-cover-provenance",
              key: auth.userId,
              limit: 5,
              windowSec: 60,
            });
            if (rate) return rate;'''.replace('          ', '')
          assert s.count(old) == 1, 'generate-cover limiter block drifted'
          p.write_text(s.replace(old, new))
          PY
          deno check supabase/functions/generate-cover/index.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/generate-cover/index.ts
          git commit -m 'harden: use durable limiter for cover generation'

      - name: Migrate process-document to durable rate limiting
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/process-document/index.ts')
          s = p.read_text()
          old_import = "import { corsHeaders, preflight, requireUser, enforceRateLimit, json as httpJson } from '../_shared/http.ts';"
          new_import = "import { corsHeaders, preflight, requireUser, enforceDurableRateLimit, json as httpJson } from '../_shared/http.ts';"
          assert s.count(old_import) == 1, 'process-document import drifted'
          s = s.replace(old_import, new_import)
          old = '''    const userId = auth.userId;

    // Per-user rate limit: 10 uploads / 10 min — protects AI gateway and DB.
    const limited = enforceRateLimit({
      name: 'process-document',
      key: userId,
      limit: 10,
      windowSec: 600,
    });
    if (limited) return limited;

    const supabaseUrl = Deno.env.get('SUPABASE_URL')!;
    const supabaseServiceKey = Deno.env.get('SUPABASE_SERVICE_ROLE_KEY')!;'''
          new = '''    const userId = auth.userId;
    const supabaseUrl = Deno.env.get('SUPABASE_URL')!;
    const supabaseServiceKey = Deno.env.get('SUPABASE_SERVICE_ROLE_KEY')!;
    const adminSupabase = createClient(supabaseUrl, supabaseServiceKey);

    // Per-user rate limit: 10 uploads / 10 min — durable across edge instances.
    const limited = await enforceDurableRateLimit(adminSupabase, {
      name: 'process-document',
      key: userId,
      limit: 10,
      windowSec: 600,
    });
    if (limited) return limited;'''
          assert s.count(old) == 1, 'process-document limiter block drifted'
          s = s.replace(old, new)
          duplicate = "    const adminSupabase = createClient(supabaseUrl, supabaseServiceKey);\n"
          # The newly inserted declaration plus the original later declaration should now total two.
          assert s.count(duplicate) == 2, 'process-document admin client count unexpected'
          first = s.find(duplicate)
          second = s.find(duplicate, first + len(duplicate))
          s = s[:second] + s[second + len(duplicate):]
          p.write_text(s)
          PY
          deno check supabase/functions/process-document/index.ts
          git add supabase/functions/process-document/index.ts
          git commit -m 'harden: use durable limiter for document processing'

      - name: Add process-document to permanent edge typecheck gate
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          s = p.read_text()
          anchor = '          deno check supabase/functions/generate-cover-raw/index.ts\n'
          addition = anchor + '          deno check supabase/functions/process-document/index.ts\n'
          assert s.count(anchor) == 1, 'CI publication typecheck anchor drifted'
          assert 'deno check supabase/functions/process-document/index.ts' not in s, 'process-document already gated'
          p.write_text(s.replace(anchor, addition))
          PY
          git add .github/workflows/ci.yml
          git commit -m 'ci: type-check document processing edge function'

      - name: Push independently revertable commits
        run: git push origin HEAD:refs/heads/claude/scroll-wisdom-weave-review-mtckux
