name: Apply EPUB mimetype ZIP repair

on:
  push:
    branches: [hardening/official-epubcheck-gate]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/official-epubcheck-gate
          fetch-depth: 0

      - name: Patch both direct EPUB renderers and remove this one-shot workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/export-book/index.ts')
          text = path.read_text()
          old = 'await zipWriter.add("mimetype", new zip.TextReader("application/epub+zip"), { level: 0 });'
          new = 'await zipWriter.add("mimetype", new zip.TextReader("application/epub+zip"), { level: 0, extendedTimestamp: false, ntfsTimestamp: false });'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 EPUB mimetype entries, found {count}')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/_apply-epub-mimetype-fix.yml').unlink()
          PY

      - name: Commit targeted repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/export-book/index.ts .github/workflows/_apply-epub-mimetype-fix.yml
          git commit -m "fix: remove forbidden EPUB mimetype ZIP extra fields"
          git push origin HEAD:hardening/official-epubcheck-gate
