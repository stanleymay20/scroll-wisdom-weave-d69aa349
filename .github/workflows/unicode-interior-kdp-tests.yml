name: Unicode KDP Interior Tests

on:
  push:
    branches:
      - fix/unicode-safe-pdf-interior
    paths:
      - .github/workflows/unicode-interior-kdp-tests.yml

permissions:
  contents: write

jobs:
  kdp-interior:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/unicode-safe-pdf-interior
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - run: bun install --frozen-lockfile
      - name: Add direct KDP interior Unicode regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          renderer = Path('supabase/functions/export-book/index.ts')
          source = renderer.read_text()
          old_decl = 'async function generateKDPPDF(\n'
          new_decl = 'export async function generateKDPPDF(\n'
          assert source.count(old_decl) == 1, 'KDP renderer declaration drifted'
          renderer.write_text(source.replace(old_decl, new_decl, 1))

          test_file = Path('supabase/functions/export-book/_test.ts')
          tests = test_file.read_text()
          old_import = 'import { generateCanonicalPDF } from "./index.ts";'
          new_import = 'import { generateCanonicalPDF, generateKDPPDF } from "./index.ts";'
          assert tests.count(old_import) == 1, 'renderer test import drifted'
          tests = tests.replace(old_import, new_import, 1)

          marker = '// =====================================================================\n// Canonical DOCX renderer tests'
          assert tests.count(marker) == 1, 'DOCX test marker drifted'
          block = (
              'const KDP_UNICODE_PRINT_FIXTURE = "Akan ɛ ɔ · Greek α β · Math ∑ ∫ ≤ ≥ · Hebrew שלום";\n\n'
              'async function renderKdpInteriorForTest(content: string) {\n'
              '  return await generateKDPPDF(\n'
              '    makeBook({ title: `KDP ${KDP_UNICODE_PRINT_FIXTURE}` }),\n'
              '    [{ chapter_number: 1, title: `Chapter ${KDP_UNICODE_PRINT_FIXTURE}`, content }],\n'
              '    `Author ${KDP_UNICODE_PRINT_FIXTURE}`,\n'
              '    "TEST-KDP-0001",\n'
              '    false,\n'
              '    2026,\n'
              '    null,\n'
              '    false,\n'
              '    "APA",\n'
              '    [],\n'
              '    { width: 432, height: 648, name: \'6" × 9"\' },\n'
              '    false,\n'
              '    ctx,\n'
              '  );\n'
              '}\n\n'
              'Deno.test("KDP interior PDF: preserves required Unicode fixture and Hebrew", async () => {\n'
              '  const bytes = await renderKdpInteriorForTest([\n'
              '    KDP_UNICODE_PRINT_FIXTURE,\n'
              '    "",\n'
              '    `**Bold ${KDP_UNICODE_PRINT_FIXTURE}** and *italic ${KDP_UNICODE_PRINT_FIXTURE}*.`,\n'
              '    "",\n'
              '    "```text",\n'
              '    KDP_UNICODE_PRINT_FIXTURE,\n'
              '    "```",\n'
              '  ].join("\\n"));\n'
              '  assertValidPDF(bytes, 5_000);\n'
              '});\n\n'
              'Deno.test("KDP interior PDF: unsupported glyph fails loudly with exact codepoint", async () => {\n'
              '  let caught: unknown = null;\n'
              '  try {\n'
              '    await renderKdpInteriorForTest("This unsupported glyph must not disappear: 漢");\n'
              '  } catch (error) {\n'
              '    caught = error;\n'
              '  }\n'
              '  assert(caught instanceof Error, "unsupported KDP glyph should reject the PDF export");\n'
              '  assertEquals((caught as Error & { code?: string }).code, "PDF_UNSUPPORTED_GLYPH");\n'
              '  assert(caught.message.includes("U+6F22"), `expected U+6F22 in error, got: ${caught.message}`);\n'
              '});\n\n'
          )
          test_file.write_text(tests.replace(marker, block + marker, 1))
          PY
          git diff --check -- supabase/functions/export-book/index.ts supabase/functions/export-book/_test.ts
      - name: Verify KDP interior Unicode behavior
        run: |
          deno check supabase/functions/export-book/index.ts
          deno test --allow-net supabase/functions/export-book/_test.ts
          deno test supabase/functions/_shared/kdp-print-cover_test.ts
      - name: Commit verified KDP regression surface only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Stanley Osei-Wusu"
          git config user.email "107648937+stanleymay20@users.noreply.github.com"
          git add supabase/functions/export-book/index.ts supabase/functions/export-book/_test.ts
          expected=$'supabase/functions/export-book/_test.ts\nsupabase/functions/export-book/index.ts'
          test "$(git diff --cached --name-only)" = "$expected"
          git diff --cached --check
          git commit -m "Prove KDP interior Unicode fidelity"
          git push origin HEAD:fix/unicode-safe-pdf-interior
