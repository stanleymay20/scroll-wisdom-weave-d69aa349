name: Generate Book Auth Remediation

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: generate-book-auth-remediation-${{ github.ref }}
  cancel-in-progress: true

env:
  DENO_VERSION: 2.9.6
  WORK_BRANCH: claude/scroll-wisdom-weave-review-mtckux

jobs:
  harden-auth-boundary:
    if: github.event.pull_request.head.ref == 'claude/scroll-wisdom-weave-review-mtckux'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.WORK_BRANCH }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Preload frozen Edge dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cd supabase/functions
          mapfile -d '' entries < <(find . -type f -name '*.ts' -print0 | sort -z)
          test "${#entries[@]}" -gt 0
          deno install --config deno.json --entrypoint --lockfile-only --frozen "${entries[@]}"
      - name: Replace service-role authentication with shared user boundary
        run: |
          set -euo pipefail
          python3 scripts/remediate-generate-book-auth.py
          deno check --config supabase/functions/deno.json supabase/functions/generate-book/index.ts
      - name: Commit isolated auth-boundary change
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/generate-book/index.ts
          git diff --cached --check
          git commit -m "harden: separate generate-book user and service boundaries"
          git push origin "HEAD:${WORK_BRANCH}"
