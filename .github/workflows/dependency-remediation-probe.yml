name: Dependency Remediation Probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-remediation-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-patched-transitives:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'claude/scroll-wisdom-weave-review-mtckux'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: claude/scroll-wisdom-weave-review-mtckux
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - name: Verify committed lockfile installs
        run: bun install --frozen-lockfile
      - name: Add verified same-major patched transitive overrides
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.overrides = {
            ...(p.overrides || {}),
            'lodash-es': '>4.17.23 <5',
            'underscore': '>1.13.7 <2',
            'fast-uri': '>=3.1.6 <4',
            '@babel/plugin-transform-modules-systemjs': '>7.29.3 <8',
            'nanoid': '>=3.3.16 <4',
            'postcss': '>8.5.11 <9',
            'browserslist': '>4.28.6 <5'
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          bun install
      - name: Verify candidate before committing
        run: |
          bun run typecheck
          bun run lint
          bun run test
          bun run build:release
          bun audit --prod --audit-level=high || true
      - name: Commit generated manifest and lockfile to the work branch
        shell: bash
        run: |
          if git diff --quiet -- package.json bun.lock; then
            echo 'No dependency changes remain to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock
          git commit -m 'deps: apply patched transitive security updates'
          git push origin HEAD:refs/heads/claude/scroll-wisdom-weave-review-mtckux
