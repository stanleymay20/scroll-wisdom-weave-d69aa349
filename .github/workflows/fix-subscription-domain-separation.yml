name: Fix subscription domain separation
on:
  push:
    branches: [main]
    paths:
      - scripts/fix-subscription-domain-separation.mjs
      - .github/workflows/fix-subscription-domain-separation.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/fix-subscription-domain-separation.mjs
      - name: Commit webhook repair
        run: |
          if git diff --quiet; then exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/stripe-webhook/index.ts
          git commit -m "fix(billing): separate creator and plan webhook state"
          git pull --rebase origin main
          git push origin HEAD:main
