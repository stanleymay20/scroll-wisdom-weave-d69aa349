version: 2

updates:
  # GitHub Actions are pinned by major tag in .github/workflows/. Unreviewed
  # action drift is a supply-chain path into a workflow that holds repository
  # credentials, so these are grouped and raised weekly.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # Application dependencies are Bun-native and resolved from bun.lock.
  #
  # CI installs with `bun install --frozen-lockfile`, so Dependabot must update
  # package.json and bun.lock together. GitHub's dedicated Bun ecosystem supports
  # the text-based bun.lock used by this repository.
  #
  # `bun run audit:dependencies` gates high and critical production advisories
  # against the time-boxed baseline in security/audit-exceptions.json.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    groups:
      # Radix ships many small packages in lockstep; one PR per package is noise.
      radix-ui:
        patterns:
          - "@radix-ui/*"
      supabase:
        patterns:
          - "@supabase/*"
      dev-tooling:
        dependency-type: "development"
        patterns:
          - "*"
    ignore:
      # React 19 is a deliberate migration, not a dependency bump.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]

      # These upgrades cross framework/tooling major-version boundaries and
      # require an explicit migration PR with compatibility work and release
      # evidence. Keep routine patch/minor updates automated.
      - dependency-name: "@hookform/resolvers"
        update-types: ["version-update:semver-major"]
      - dependency-name: "date-fns"
        update-types: ["version-update:semver-major"]
      - dependency-name: "framer-motion"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-resizable-panels"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mermaid"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sonner"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwind-merge"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]

      # The development toolchain must move as a coordinated stack. The current
      # majors include TypeScript 7, Tailwind 4, ESLint 10 and Vite 8; CI proved
      # that mixing them into routine grouped updates breaks lint/build/type
      # tooling. Allow their non-major updates to continue.
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/jest-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react-swc"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-refresh"
        update-types: ["version-update:semver-major"]
      - dependency-name: "globals"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # Pinned deliberately: see the "overrides" block in package.json.
      - dependency-name: "@xmldom/xmldom"
